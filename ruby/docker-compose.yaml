name: ruby

# echo ... > /ghpass
# chmod 0100 /ghpass

services:
  deployment:
    container_name: deployment
    image: chrissx/deployment:latest
    init: true
    command: -D -H /var/deployment -d /var/deployment/conf/ruby/deployments.csv
    volumes:
      - /var/deployment:/var/deployment
      - /root/.gitconfig:/root/.gitconfig:ro
      - /ghpass:/ghpass:ro
    environment:
      - GIT_ASKPASS=/ghpass
    restart: unless-stopped
    pull_policy: always
  erwin:
    container_name: erwin
    image: chrissx/erwin:latest
    networks:
      - webservices
    ports:
      - 8080:8080
    restart: unless-stopped
    pull_policy: always
  jasmin:
    container_name: jasmin
    image: ghcr.io/zermzeitung/jasmin:latest
    depends_on:
      deployment:
        condition: service_healthy
    networks:
      - webservices
    volumes:
      - /var/deployment/zerm:/var/www/zerm.eu:ro
    restart: unless-stopped
    pull_policy: always
  kct-bottom:
    container_name: kct-bottom
    image: chrissx/kinkcheck.top:bottom
    networks:
      - webservices
    volumes:
      - /var/kct/bottom:/data
    restart: unless-stopped
    pull_policy: always
  kct-main:
    container_name: kct-main
    image: chrissx/kinkcheck.top:latest
    networks:
      - webservices
    volumes:
      - /var/kct/prod:/data
    restart: unless-stopped
    pull_policy: always
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/ruby.caddy --adapter caddyfile
    depends_on:
      deployment:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    networks:
      - webservices
      - monitoring_default
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - /var/deployment/conf/caddy:/etc/caddy:ro
      - /var/deployment/dist:/srv/dist:ro
      - /var/deployment/data/caddy-data:/data
      - /var/deployment/data/caddy-config:/config
    restart: unless-stopped
    pull_policy: always

networks:
  webservices:
    enable_ipv6: true
  monitoring_default:
    external: true
