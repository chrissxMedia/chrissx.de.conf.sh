name: Build and publish new containers

on:
  push:
    branches: [master]

jobs:
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e ACME_EMAIL=noreply@chrissx.de \
            -v "$PWD/tobias/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check the Caddyfile formatting
        run: |
          docker run --rm -v "$PWD/tobias/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy fmt --diff /etc/caddy/Caddyfile
      - name: Validate the compose file
        env:
          ACME_EMAIL: noreply@chrissx.de
          SIMON_TOKEN: ci
          SIMON_RECORD4: ci
          SIMON_RECORD6: ci
        run: docker compose -f tobias/docker-compose.yaml config -q
  simon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          context: simon
          platforms: linux/amd64
          tags: chrissx/simon:latest
  ali:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          context: ali
          platforms: linux/amd64,linux/arm64,linux/arm
          tags: chrissx/ali:latest
