name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e ACME_EMAIL=noreply@chrissx.de \
            -v "$PWD/tobias/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check the Caddyfile formatting
        run: |
          docker run --rm -v "$PWD/tobias/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy fmt --diff /etc/caddy/Caddyfile
      - name: Validate the compose file
        env:
          ACME_EMAIL: noreply@chrissx.de
          SIMON_TOKEN: ci
          SIMON_RECORD4: ci
          SIMON_RECORD6: ci
        run: docker compose -f tobias/docker-compose.yaml config -q
