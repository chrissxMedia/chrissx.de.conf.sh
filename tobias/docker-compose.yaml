name: tobias

services:
  deployment:
    container_name: deployment
    image: chrissx/deployment:latest
    init: true
    command: -D -H /var/deployment -d /var/deployment/conf/tobias/deployments.csv
    volumes:
      - /var/deployment:/var/deployment
    restart: unless-stopped
    pull_policy: always
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    depends_on:
      deployment:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - webservices
      - monitoring_default
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - /var/deployment/conf/tobias/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/deployment/dist:/srv/dist:ro
      - /home/pixel/inventree-26/data/static:/srv/inventree/static:ro
      - /home/pixel/inventree-26/data/media:/srv/inventree/media:ro
      - /var/caddy/data:/data
      - /var/caddy/config:/config
    restart: unless-stopped
    pull_policy: always
  bucket:
    container_name: bucket
    image: chrissx/bucket:latest
    networks:
      - webservices
    volumes:
      - /var/bucket:/var/bucket
    restart: unless-stopped
    pull_policy: always
  ferdium:
    container_name: ferdium
    image: ferdium/ferdium-server:latest
    environment:
      NODE_ENV: production
      APP_URL: https://ferdium.chrissx.de
      DB_CONNECTION: sqlite
      DB_DATABASE: ferdium
      DATA_DIR: /data
      JWT_USE_PEM: "true"
      IS_REGISTRATION_ENABLED: "false"
      IS_CREATION_ENABLED: "false"
      IS_DASHBOARD_ENABLED: "true"
      CONNECT_WITH_FRANZ: "false"
    networks:
      - webservices
    volumes:
      - /var/ferdium:/data
      - /var/ferdium/recipes:/app/build/recipes
    restart: unless-stopped
    pull_policy: always
  inventree-db:
    container_name: inventree-db
    image: postgres:19
    environment:
      PGDATA: /var/lib/postgresql/data/pgdb
      POSTGRES_DB: inventree
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: ${INVENTREE_DB_PASSWORD:?Set INVENTREE_DB_PASSWORD in .env}
    networks:
      - inventree
    volumes:
      - /home/pixel/inventree-26/data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, pguser, -d, inventree]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  inventree-server:
    container_name: inventree-server
    image: inventree/inventree:stable
    depends_on:
      inventree-db:
        condition: service_healthy
    environment: &inventree-env
      INVENTREE_DB_ENGINE: postgresql
      INVENTREE_DB_HOST: inventree-db
      INVENTREE_DB_PORT: "5432"
      INVENTREE_DB_NAME: inventree
      INVENTREE_DB_USER: pguser
      INVENTREE_DB_PASSWORD: ${INVENTREE_DB_PASSWORD:?Set INVENTREE_DB_PASSWORD in .env}
      INVENTREE_WEB_PORT: "8000"
      INVENTREE_SITE_URL: https://inv.chrissx.de
      INVENTREE_USE_X_FORWARDED_PROTO: "True"
      INVENTREE_DEBUG: "False"
      INVENTREE_LOG_LEVEL: WARNING
      INVENTREE_PLUGINS_ENABLED: "True"
    networks:
      - webservices
      - inventree
    volumes:
      - /home/pixel/inventree-26/data:/home/inventree/data
    healthcheck:
      test: [CMD, curl, -fsS, -H, "Host: inv.chrissx.de", "http://127.0.0.1:8000/api/system/health/"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped
  inventree-worker:
    container_name: inventree-worker
    image: inventree/inventree:stable
    command: invoke worker
    depends_on:
      inventree-server:
        condition: service_healthy
    environment: *inventree-env
    networks:
      - inventree
    volumes:
      - /home/pixel/inventree-26/data:/home/inventree/data
    restart: unless-stopped
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    # Zigbee radio on ttyUSB0, and mDNS discovery, need the host network.
    network_mode: host
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    group_add:
      - dialout
    volumes:
      - /var/hass:/config
    restart: unless-stopped
    pull_policy: always
  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/matterjs-server:stable
    # Matter needs IPv6 and mDNS multicast on the LAN.
    network_mode: host
    environment:
      LISTEN_ADDRESS: 127.0.0.1
    volumes:
      - /var/matter-server:/data
    restart: unless-stopped
    pull_policy: always
  mumble:
    container_name: mumble
    image: mumblevoip/mumble-server:latest
    ports:
      - 64738:64738/tcp
      - 64738:64738/udp
    volumes:
      - /var/mumble:/data
    restart: unless-stopped
    pull_policy: always
  simon:
    container_name: simon
    image: chrissx/simon:latest
    # Needs working IPv4 and IPv6 outbound to read the public address.
    network_mode: host
    environment:
      TOKEN: ${SIMON_TOKEN:?Set SIMON_TOKEN in .env}
      RECORD4: ${SIMON_RECORD4:?Set SIMON_RECORD4 in .env}
      RECORD6: ${SIMON_RECORD6:?Set SIMON_RECORD6 in .env}
    restart: unless-stopped
    pull_policy: always
  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    command: --interval 3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    pull_policy: always

networks:
  webservices:
    enable_ipv6: true
  inventree:
  monitoring_default:
    external: true
