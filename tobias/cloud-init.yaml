#cloud-config

package_update: true
package_upgrade: true
packages:
  - curl
  - git
  - tmux
  - vim
  - ncdu
  - tree
  - docker.io
  - docker-compose-v2
  - rsync

write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "metrics-addr" : "0.0.0.0:9323"
      }

runcmd:
  - usermod -aG docker pixel
  - mkdir -p /home/pixel/deployment
  - git clone https://github.com/chrissxMedia/chrissx.de.conf.sh.git /home/pixel/deployment/conf
  - install -m 644 /home/pixel/deployment/conf/tobias/backup.service /home/pixel/deployment/conf/tobias/backup.timer /etc/systemd/system/
  - systemctl daemon-reload
  - systemctl enable --now docker
