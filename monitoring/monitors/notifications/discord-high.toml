type = "notification"
name = "Discord high"
active = true
is_default = false

[config]
type = "discord"
discordWebhookUrl = '''"{{ get_env(name='AUTOKUMA__ENV__DISCORD_WEBHOOK') | json_encode | split(pat='') | slice(start=2, end=-2) | join(sep='') }}"'''
discordUsername = '''Monitoring {{ get_env(name='AUTOKUMA__ENV__SITE') }}'''
discordSuppressNotifications = false
discordPrefixMessage = '''"{{ get_env(name='AUTOKUMA__ENV__DISCORD_MENTION', default='') | json_encode | split(pat='') | slice(start=2, end=-2) | join(sep='') }}"'''
applyExisting = false
